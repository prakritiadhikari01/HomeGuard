<div class="flex gap-4 group">

    <div class="flex flex-col items-center">
        <div class="w-3 h-3 rounded-full {{ color }}"></div>
        <div class="w-px flex-1 bg-white/10 mt-2"></div>
    </div>

    <div class="flex-1 pb-6 border-b border-white/5 group-hover:border-white/10 transition">

        <div class="flex justify-between gap-4">

            <div>
                <h4 class="font-semibold text-lg">{{ title }}</h4>
                <p class="text-slate-400 mt-1">{{ subtitle }}</p>
            </div>

            <p class="text-sm text-slate-500 whitespace-nowrap">
                {{ time }}
            </p>

        </div>

    </div>

</div>
